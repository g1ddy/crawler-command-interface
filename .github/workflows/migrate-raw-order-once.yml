name: Migrate Raw Event Order Once

on:
  push:
    branches:
      - codex/party-replay-aware-membership
    paths:
      - .github/workflows/migrate-raw-order-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/party-replay-aware-membership
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run migration
        run: node scripts/remove-raw-event-order.mjs
      - name: Regenerate derived fixtures
        run: node --experimental-strip-types scripts/sync-derived-fixtures.mjs
      - name: Remove one-shot workflow
        run: git rm .github/workflows/migrate-raw-order-once.yml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/raw/floors app/domain/schema/crawler-floor-raw.schema.json app/domain/types.ts app/domain/raw-adapter.ts RAW_OBSERVATIONS.md tests/raw-floor-adapter.test.mjs data/floors data/compiled-timeline.json .github/workflows
          git diff --cached --check
          git commit -m "Remove authored raw event order"
          git push origin HEAD:codex/party-replay-aware-membership
