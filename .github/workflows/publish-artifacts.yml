name: Publish Generated Artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to finalize'
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: artifact-finalization-${{ github.event.pull_request.number || github.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  resolve-pr:
    name: Resolve Target Pull Request
    runs-on: ubuntu-24.04
    outputs:
      pr_repo: ${{ steps.resolve.outputs.pr_repo }}
      head_branch: ${{ steps.resolve.outputs.head_branch }}
      expected_head_sha: ${{ steps.resolve.outputs.expected_head_sha }}
      is_fork: ${{ steps.resolve.outputs.is_fork }}
    steps:
      - name: Resolve PR context
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -z "${INPUT_PR_NUMBER}" ]; then
              echo "Error: workflow_dispatch requires pr_number."
              exit 1
            fi

            echo "Resolving PR #${INPUT_PR_NUMBER} via GitHub API..."
            pr_json="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${DEFAULT_REPO}/pulls/${INPUT_PR_NUMBER}")"

            pr_repo="$(echo "${pr_json}" | jq -r '.head.repo.full_name')"
            head_branch="$(echo "${pr_json}" | jq -r '.head.ref')"
            expected_head_sha="$(echo "${pr_json}" | jq -r '.head.sha')"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            pr_repo="${PR_HEAD_REPO}"
            head_branch="${PR_HEAD_REF}"
            expected_head_sha="${PR_HEAD_SHA}"
          else
            echo "Error: unsupported event ${EVENT_NAME}."
            exit 1
          fi

          if [ "${pr_repo}" = "null" ] || [ -z "${pr_repo}" ] || \
             [ "${head_branch}" = "null" ] || [ -z "${head_branch}" ] || \
             [ "${expected_head_sha}" = "null" ] || [ -z "${expected_head_sha}" ]; then
            echo "Error: Could not resolve target pull request."
            exit 1
          fi

          is_fork="false"
          if [ "${pr_repo}" != "${DEFAULT_REPO}" ]; then
            is_fork="true"
          fi

          echo "pr_repo=${pr_repo}" >> "$GITHUB_OUTPUT"
          echo "head_branch=${head_branch}" >> "$GITHUB_OUTPUT"
          echo "expected_head_sha=${expected_head_sha}" >> "$GITHUB_OUTPUT"
          echo "is_fork=${is_fork}" >> "$GITHUB_OUTPUT"

          echo "Target Repository: ${pr_repo}"
          echo "Head Branch: ${head_branch}"
          echo "Expected Head SHA: ${expected_head_sha}"
          echo "Is Fork: ${is_fork}"

  verify-screenshots:
    name: Verify Screenshots
    needs: resolve-pr
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout PR source SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-pr.outputs.pr_repo }}
          ref: ${{ needs.resolve-pr.outputs.expected_head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      - name: Enforce browser interaction policy
        run: node --test tests/browser-test-policy.test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Clear generated documentation screenshots
        shell: bash
        run: rm -f docs/images/screenshot-*.png

      - name: Generate documentation screenshots
        run: npm run test:screenshots
        env:
          CI: true

      - name: Verify canonical screenshot set
        run: node --experimental-strip-types tests/screenshots/canonical-screenshots.ts --verify-canonical

      - name: Upload generated screenshots
        uses: actions/upload-artifact@v4
        with:
          name: crawler-documentation-screenshots-${{ needs.resolve-pr.outputs.expected_head_sha }}
          path: docs/images/*.png
          if-no-files-found: error
          retention-days: 14

  verify-maritime:
    name: Verify Maritime Architecture Analysis
    needs: resolve-pr
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout PR source SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-pr.outputs.pr_repo }}
          ref: ${{ needs.resolve-pr.outputs.expected_head_sha }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install Crawler dependencies
        run: npm ci

      - name: Analyze with Maritime
        uses: g1ddy/dependency-maritime@05315851a619ef8b854af365e09d64290370639b
        with:
          node-version: '22.13.0'
          cli-source: '@dependency-maritime/cli@0.1.0-beta.4'
          source-roots: 'app src'
          output-dir: '.maritime'
          fail-on-unmeasured: 'true'
          upload-artifact: 'false'
          render-graph: 'true'
          graph-output: 'docs/images/dependency-graph.svg'

      - name: Inspect Maritime outputs
        run: find .maritime -maxdepth 1 -type f -print

      - name: Verify Maritime artifacts
        run: npm run verify:maritime

      - name: Upload Maritime analysis
        uses: actions/upload-artifact@v4
        with:
          name: maritime-analysis-${{ needs.resolve-pr.outputs.expected_head_sha }}
          path: |
            .maritime/
            docs/images/dependency-graph.svg
          if-no-files-found: error
          include-hidden-files: true

  publish:
    name: Promote Generated Artifacts
    needs: [resolve-pr, verify-screenshots, verify-maritime]
    runs-on: ubuntu-24.04
    environment: artifact-finalization
    if: needs.resolve-pr.outputs.is_fork == 'false'
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-pr.outputs.pr_repo }}
          ref: ${{ needs.resolve-pr.outputs.head_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: npm ci

      - name: Download screenshot artifact
        uses: actions/download-artifact@v4
        with:
          name: crawler-documentation-screenshots-${{ needs.resolve-pr.outputs.expected_head_sha }}
          path: docs/images

      - name: Download Maritime artifact
        uses: actions/download-artifact@v4
        with:
          name: maritime-analysis-${{ needs.resolve-pr.outputs.expected_head_sha }}
          path: .

      - name: Verify downloaded artifacts
        run: |
          node --experimental-strip-types tests/screenshots/canonical-screenshots.ts --verify-canonical
          npm run verify:maritime

      - name: Promote and publish generated artifacts
        shell: bash
        env:
          HEAD_BRANCH: ${{ needs.resolve-pr.outputs.head_branch }}
          EXPECTED_HEAD_SHA: ${{ needs.resolve-pr.outputs.expected_head_sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1. Check for substantive changes.
          has_screenshot_changes=false
          git add -N -- 'docs/images/screenshot-*.png'
          if ! git diff --quiet -- 'docs/images/screenshot-*.png'; then
            has_screenshot_changes=true
          fi

          has_maritime_changes=false
          if node scripts/has-substantive-maritime-changes.mjs; then
            comparison_status=0
          else
            comparison_status=$?
          fi

          case "${comparison_status}" in
            0)
              ;;
            1)
              has_maritime_changes=true
              ;;
            *)
              echo "Maritime baseline comparison failed with status ${comparison_status}."
              exit "${comparison_status}"
              ;;
          esac

          if ! git diff --quiet -- docs/images/dependency-graph.svg; then
            has_maritime_changes=true
          fi

          if [ "${has_screenshot_changes}" = "false" ] && [ "${has_maritime_changes}" = "false" ]; then
            echo "Both screenshot and Maritime artifacts are already current."
            exit 0
          fi

          # 2. Verify remote head before committing and pushing.
          git fetch --no-tags origin "${HEAD_BRANCH}"
          newer_remote_head="$(git rev-parse FETCH_HEAD)"
          if [ "${newer_remote_head}" != "${EXPECTED_HEAD_SHA}" ]; then
            echo "PR branch advanced during verification from ${EXPECTED_HEAD_SHA} to ${newer_remote_head}. Refusing to publish."
            exit 1
          fi

          # 3. Commit and push both generated artifact families in one approved write.
          # The native skip marker prevents this already-verified generated-only
          # commit from spawning redundant PR workflow runs that require a second
          # maintainer approval.
          git add -- 'docs/images/screenshot-*.png' .maritime docs/images/dependency-graph.svg
          git commit -m "chore: publish generated artifacts [skip ci]"
          git push origin "HEAD:${HEAD_BRANCH}"
