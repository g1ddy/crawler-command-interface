name: Screenshot Export

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  screenshots:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      - name: Download validated Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages-artifact
          path: dist-pages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify artifact provenance
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -f dist-pages/build-provenance.json
          test "$(jq -r '.commitSha' dist-pages/build-provenance.json)" = "$EXPECTED_SHA"

      - run: npx playwright install --with-deps chromium

      - name: Export canonical screenshots
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: npx vite preview --config vite.pages.config.ts --host 127.0.0.1 --port 4173
        run: npm run test:screenshots

      - name: Add screenshot provenance and checksums
        run: |
          cp dist-pages/build-provenance.json artifacts/screenshots/build-provenance.json
          sha256sum artifacts/screenshots/*.png > artifacts/screenshots/SHA256SUMS.txt

      - name: Upload screenshot bundle
        uses: actions/upload-artifact@v4
        with:
          name: crawler-interface-screenshots-${{ github.event.workflow_run.id }}
          path: artifacts/screenshots/
          if-no-files-found: error
          retention-days: 30

      - name: Upload screenshot diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: crawler-screenshot-diagnostics-${{ github.event.workflow_run.id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
