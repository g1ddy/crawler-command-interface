name: Update Documentation Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'src/**'
      - 'app/**'
      - 'data/**'
      - 'public/**'
      - 'index.html'
      - 'vite.pages.config.ts'
      - 'playwright.screenshots.config.ts'
      - 'tests/screenshots/**'
      - 'tests/browser-test-policy.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      - name: Enforce browser interaction policy
        run: node --test tests/browser-test-policy.test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Clear generated documentation screenshots
        shell: bash
        run: rm -f docs/images/screenshot-*.png

      - name: Generate documentation screenshots
        run: npm run test:screenshots
        env:
          CI: true

      - name: Verify canonical screenshot set
        run: node --experimental-strip-types tests/screenshots/canonical-screenshots.ts --verify-canonical

      - name: Upload generated screenshots
        uses: actions/upload-artifact@v4
        with:
          name: crawler-documentation-screenshots-${{ github.event.pull_request.number }}
          path: docs/images/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit refreshed documentation screenshots
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'docs/images/screenshot-*.png'
          if git diff --cached --quiet; then
            echo "Documentation screenshots are already current."
            exit 0
          fi
          git commit -m "docs(assets): refresh interface screenshots"
          git push origin "HEAD:${HEAD_BRANCH}"
