name: Finalize PR 134 Contract Once

on:
  push:
    branches:
      - codex/party-replay-aware-membership
    paths:
      - scripts/finalize-pr134-contract.mjs
      - scripts/finalize-pr134-contract-fixes.mjs
      - .github/workflows/finalize-pr134-contract-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/party-replay-aware-membership
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply contract cleanup
        run: |
          node scripts/finalize-pr134-contract.mjs
          node scripts/finalize-pr134-contract-fixes.mjs
      - name: Regenerate derived fixtures
        run: npm run generate:fixture
      - name: Verify
        run: npm run verify
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Standardize floor event IDs and address PR feedback"
          git push origin HEAD:codex/party-replay-aware-membership
