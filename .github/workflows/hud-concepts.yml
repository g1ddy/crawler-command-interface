name: HUD concepts

on:
  pull_request:
    paths:
      - 'src/**'
      - 'app/domain/**'
      - 'data/**'
      - '*concepts*'
      - 'tests/concepts/**'
      - 'vite.pages.config.ts'
      - 'package*.json'
      - '.github/workflows/hud-concepts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:concepts
      - name: Upload interactive concept bundle
        uses: actions/upload-artifact@v4
        with:
          name: hud-concept-bundle
          path: dist-concepts
          if-no-files-found: error
      - name: Upload comparison screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-concept-comparison
          path: test-results/concepts
          if-no-files-found: warn
