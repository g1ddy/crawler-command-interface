name: Maritime Architecture Analysis

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Crawler
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          path: crawler
          fetch-depth: 0

      - name: Checkout Dependency Maritime
        uses: actions/checkout@v4
        with:
          repository: g1ddy/dependency-maritime
          ref: 0c2e9369356edb32f04ffb261c3705e0c23cd08b
          path: maritime

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Build and pack Maritime
        working-directory: maritime
        run: |
          npm ci
          npm run build:cli
          mkdir -p ../packages
          npm pack --pack-destination ../packages

      - name: Install Crawler and packed Maritime CLI
        working-directory: crawler
        run: |
          npm ci
          TARBALL=$(ls ../packages/dependency-maritime-cli-*.tgz | head -n1)
          npm install --no-save "$TARBALL"

      - name: Analyze Crawler architecture
        working-directory: crawler
        run: npm run analyze:architecture

      - name: Inspect Maritime outputs
        run: find crawler/.maritime -maxdepth 1 -type f -print

      - name: Upload Maritime analysis
        uses: actions/upload-artifact@v4
        with:
          name: maritime-analysis
          path: crawler/.maritime/
          if-no-files-found: error
          include-hidden-files: true

      - name: Commit Maritime baseline to labeled PR branch
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'maritime') &&
          github.event.pull_request.head.repo.full_name == github.repository
        working-directory: crawler
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- .maritime)" ]; then
            echo "Maritime baseline is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .maritime
          git commit -m "chore: update Maritime architecture baseline"
          git push origin "HEAD:${HEAD_BRANCH}"
