name: Maritime Architecture Analysis

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maritime-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Crawler
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install Crawler dependencies
        run: npm ci

      - name: Analyze with Maritime
        uses: g1ddy/dependency-maritime@05315851a619ef8b854af365e09d64290370639b
        with:
          node-version: '22.13.0'
          cli-source: '@dependency-maritime/cli@0.1.0-beta.4'
          source-roots: 'app src'
          output-dir: '.maritime'
          fail-on-unmeasured: 'true'
          upload-artifact: 'false'
          render-graph: 'true'
          graph-output: 'docs/images/dependency-graph.svg'

      - name: Inspect Maritime outputs
        run: find .maritime -maxdepth 1 -type f -print

      - name: Verify Maritime artifacts
        run: npm run verify:maritime

      - name: Upload Maritime analysis
        uses: actions/upload-artifact@v4
        with:
          name: maritime-analysis-${{ github.event.pull_request.number || github.sha }}
          path: |
            .maritime/
            docs/images/dependency-graph.svg
          if-no-files-found: error
          include-hidden-files: true
