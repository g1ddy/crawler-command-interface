name: Maritime Architecture Analysis

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Crawler
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install Crawler dependencies
        run: npm ci

      - name: Analyze with Maritime
        uses: g1ddy/dependency-maritime@0291da99242e70080522c9d465d902a31966e47e
        with:
          node-version: '22.13.0'
          cli-source: '@dependency-maritime/cli@0.1.0-beta.2'
          source-roots: 'app src'
          output-dir: '.maritime'
          fail-on-unmeasured: 'true'
          upload-artifact: 'false'

      - name: Inspect Maritime outputs
        run: find .maritime -maxdepth 1 -type f -print

      - name: Upload Maritime analysis
        uses: actions/upload-artifact@v4
        with:
          name: maritime-analysis
          path: .maritime/
          if-no-files-found: error
          include-hidden-files: true

      - name: Commit Maritime baseline to labeled PR branch
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'maritime') &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if node scripts/has-substantive-maritime-changes.mjs; then
            echo "Maritime baseline is already current."
            exit 0
          else
            comparison_status=$?
            if [ "$comparison_status" -ne 1 ]; then
              exit "$comparison_status"
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .maritime
          git commit -m "chore: update Maritime architecture baseline"
          git push origin "HEAD:${HEAD_BRANCH}"
