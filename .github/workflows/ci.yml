name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BUILD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Exercise the oldest Node release supported by package.json. TypeScript
          # stripping is opt-in on this release, as configured by the test scripts.
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      # Exercise the custom-domain base first. The deterministic verification
      # gate then produces and validates the canonical repository-path bundle.
      - run: npm run test:pages:custom-base
      - run: npm run verify
      - name: Publish canonical Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-artifact
          path: dist-pages
          if-no-files-found: error

  e2e:
    name: Playwright E2E
    needs: verify
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/playwright.yml
    with:
      checkout-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      expected-source-sha: ${{ github.event.pull_request.head.sha || github.sha }}
