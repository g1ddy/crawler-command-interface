name: Migrate Countdown Anchor Once

on:
  push:
    branches:
      - codex/party-replay-aware-membership
    paths:
      - .github/workflows/migrate-countdown-anchor-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/party-replay-aware-membership
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run migration
        run: node scripts/migrate-countdown-anchor-event-id.mjs
      - name: Regenerate derived fixtures
        run: npm run generate:fixture
      - name: Run focused tests
        run: node --experimental-strip-types --test tests/countdowns.test.mjs tests/raw-floor-adapter.test.mjs
      - name: Remove one-shot workflow
        run: git rm .github/workflows/migrate-countdown-anchor-once.yml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app/domain scripts/migrate-countdown-anchor-event-id.mjs tests data/floors data/compiled-timeline.json RAW_OBSERVATIONS.md .github/workflows
          git diff --cached --check
          git commit -m "Replace countdown anchor order with event ID"
          git push origin HEAD:codex/party-replay-aware-membership
