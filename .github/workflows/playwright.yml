name: Playwright E2E

on:
  workflow_call:
    inputs:
      checkout-repository:
        description: Repository containing the source commit that produced the artifact
        required: true
        type: string
      expected-source-sha:
        description: Source commit recorded in the validated Pages artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout-repository }}
          ref: ${{ inputs.expected-source-sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Download validated Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages-artifact
          path: dist-pages
      - name: Verify artifact provenance
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
        run: |
          test -f dist-pages/build-provenance.json
          test "$(jq -r '.sourceSha' dist-pages/build-provenance.json)" = "$EXPECTED_SOURCE_SHA"
          test "$(jq -r '.commitSha' dist-pages/build-provenance.json)" != "null"
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright against validated artifact
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: npx vite preview --config vite.pages.config.ts --host 127.0.0.1 --port 4173
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
