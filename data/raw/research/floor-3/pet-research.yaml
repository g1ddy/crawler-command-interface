claims:
  - id: P3-PET-001
    domain: pet
    kind: state
    claim:
      summary: Mongo is a dungeon-generated, pet-class Mongoliensis.
      detail: The researched material identifies Mongo as having hatched from an egg acquired on Floor 2.
    evidence:
      - sourceId: src-fandom-mongo
        relationship: supports
        confidence: corroborated
      - sourceId: src-cookbook-mongo
        relationship: corroborates
        confidence: corroborated

  - id: P3-PET-002
    domain: pet
    kind: event
    claim:
      summary: Mongo reaches Levels 6, 10, and 13 during the researched Floor 3 chronology.
    evidence:
      - sourceId: src-fandom-mongo
        relationship: supports
        confidence: corroborated
    unknowns:
      - exact_combat_encounter_for_level_6
      - exact_combat_encounter_for_level_10
      - exact_timestamp

  - id: P3-PET-003
    domain: pet
    kind: observation
    claim:
      summary: Mongo undergoes substantial physical growth during his progression.
      detail: The researched material describes growth from a roughly 7-inch hatchling to nearly 13 feet long.
    evidence:
      - sourceId: src-fandom-mongo
        relationship: supports
        confidence: corroborated
      - sourceId: src-cookbook-mongo
        relationship: corroborates
        confidence: corroborated
    unknowns:
      - exact_growth_timing
      - exact_causal_relationship_to_leveling

  - id: P3-PET-004
    domain: pet
    kind: event
    claim:
