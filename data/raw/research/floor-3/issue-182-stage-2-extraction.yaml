    kind: "event"
    claim:
      summary: "During the Floor 3 'Fools Who Broke the Glass' quest, Carl placed a Sheol Glass Reaper Case around an about-to-explode Soul Crystal and stored the resulting unstable explosive, Carl's Doomsday Scenario, in his inventory."
    evidence:
