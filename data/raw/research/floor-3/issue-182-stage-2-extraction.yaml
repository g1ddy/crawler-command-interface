        locator:
          book: 2
          chapter: 24
          section: "Story — Book 2"
        relationship: "supports"
        confidence: "corroborated"
        note: "The item page describes Carl placing the case around the volatile crystal and pulling the resulting item into his inventory; its references include Book 2 chapters 7 and 25, while the chapter-summary source places the quest event in chapter 24."
      - sourceId: "src-fandom-book2-chapters"
        locator:
          book: 2
          chapter: 24
        relationship: "corroborates"
        confidence: "corroborated"
        note: "Chapter 24 summary says Carl places the soul gem in the glass case rather than fleeing; the claim is based on secondary chapter summaries, not direct inspection of the novel."
