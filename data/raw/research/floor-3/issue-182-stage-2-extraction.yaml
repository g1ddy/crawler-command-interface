claims:
  - id: "F3-PROG-001"
    domain: "crawler"
    kind: "state"
    claim:
      summary: "Carl entered the Floor 3 class selection process at Level 13 with 36 unallocated stat points."
    evidence:
      - sourceId: "src-fandom-class"
        locator:
          book: 2
          chapter: 2
          section: "Class selection"
        relationship: "supports"
        confidence: "corroborated"
        note: "The class page says Carl had 36 available stat points and had to allocate 17 to Charisma and 6 to Dexterity, leaving 13."
      - sourceId: "src-fandom-stats"
        locator:
          book: 2
          chapter: 2
          section: "Player Stats Menu"
        relationship: "corroborates"
        confidence: "corroborated"
        note: "Explains that crawlers begin distributing accumulated stat points after selecting race and class on the Third Floor."
