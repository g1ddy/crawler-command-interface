        locator:
          book: 1
          section: "Book 1 Stats — Starting"
        relationship: "supports"
        confidence: "corroborated"
        note: "The Carl page's Book 1 stats table lists the starting values STR 6, INT 3, CON 5, DEX 5, CHR 4. This is a secondary transcription of the novel."
