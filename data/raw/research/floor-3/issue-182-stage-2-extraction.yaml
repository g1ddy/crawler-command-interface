    evidence:
      - sourceId: "src-fandom-book2-chapters"
        locator:
          book: 2
          chapter: 25
        relationship: "supports"
        confidence: "corroborated"
        note: "The chapter 25 summary explicitly lists the first, second, third, and fourth foreshock effects. This is secondary-source reporting, not book verification."
