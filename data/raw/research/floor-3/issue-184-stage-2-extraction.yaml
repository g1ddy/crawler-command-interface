  - id: f3-crawler-primal-selection
    domain: crawler
    kind: event
    claim:
      summary: Carl selects the Primal race during the Floor 3 progression/staging sequence.
      detail: The selection is a persistent progression change establishing ongoing Primal racial capabilities and modifiers.
    evidence:
      - sourceId: src-wiki-carl-f3
        confidence: confirmed
        relationship: supports
    unknowns:
      - exact_system_prompt_wording_for_primal_selection

  - id: f3-crawler-primal-cap
    domain: crawler
    kind: state
    claim:
      summary: The Primal race permanently removes the standard Level 15 skill training cap.
      detail: This capability allows skills to be trained to Level 20, with exponential scaling described by the source.
    evidence:
